<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다찌 마을 - 슬라임 전문점</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..146,400;0,9..146,600;0,9..146,700;1,9..146,400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-pink-100 via-rose-100 to-pink-50 min-h-screen flex items-center justify-center p-4" style="font-family: 'Pretendard', sans-serif;">
    <div class="w-full max-w-[420px]">
        <!-- Card Container -->
        <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden">
            <!-- Top Section with Name and Hero Image -->
            <div class="bg-white px-8 pt-10 pb-8 text-center">
                <!-- Store Name -->
                <div class="mb-2">
                    <h1 class="text-5xl font-bold text-rose-500 leading-tight" style="font-family: 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.5px;">
                        다찌 마을
                    </h1>
                </div>
                <p class="text-sm font-medium text-gray-500 mb-10 tracking-wide">
                    슬라임 전문점 🧴
                </p>

                <!-- Hero Image -->
                <div class="flex justify-center">
                    <img src="image.png" alt="다찌 마을 슬라임" class="w-60 h-60 object-contain animate-bounce-slow rounded-3xl">
                </div>
            </div>

            <!-- SNS Icons Section -->
            <div class="flex justify-center gap-6 px-8 py-6 border-b border-gray-100">
                <a href="#" class="sns-icon-btn group" title="인스타그램">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-100 to-rose-100 flex items-center justify-center group-hover:shadow-md transition-all">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-rose-500">
                            <path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4c0 3.2-2.6 5.8-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8C2 4.6 4.6 2 7.8 2zm-.6 2c-2 0-3.6 1.6-3.6 3.6v8.4c0 2 1.6 3.6 3.6 3.6h8.4c2 0 3.6-1.6 3.6-3.6V7.8c0-2-1.6-3.6-3.6-3.6H7.2z"/>
                            <path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
                            <circle cx="17.5" cy="6.5" r="1.5"/>
                        </svg>
                    </div>
                </a>
                <a href="#" class="sns-icon-btn group" title="유튜브">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-red-100 to-orange-100 flex items-center justify-center group-hover:shadow-md transition-all">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-red-500">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                    </div>
                </a>
                <a href="#" class="sns-icon-btn group" title="틱톡">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-100 to-pink-100 flex items-center justify-center group-hover:shadow-md transition-all">
                        <img src="tiktok2.png" alt="틱톡" class="w-6 h-6 object-contain">
                    </div>
                </a>
            </div>

            <!-- Main Buttons Section -->
            <div class="px-6 py-8 space-y-3">
                <!-- Button: Naver Store -->
                <a href="#" data-link="naver-store" class="link-btn phone-btn rounded-2xl py-4 px-5 flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <img src="네이버스마트스토어.png" alt="네이버 스토어" class="w-6 h-6 object-contain">
                        <span class="font-medium text-gray-800">네이버 스토어</span>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-gray-400">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <!-- Button: Instagram -->
                <a href="#" data-link="instagram" class="link-btn phone-btn rounded-2xl py-4 px-5 flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <img src="인스타그램.png" alt="인스타그램" class="w-6 h-6 object-contain">
                        <span class="font-medium text-gray-800">인스타그램</span>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-gray-400">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <!-- Button: YouTube -->
                <a href="#" data-link="youtube" class="link-btn phone-btn rounded-2xl py-4 px-5 flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <img src="youtube.png" alt="유튜브" class="w-6 h-6 object-contain">
                        <span class="font-medium text-gray-800">유튜브</span>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-gray-400">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <!-- Button: TikTok -->
                <a href="#" data-link="tiktok" class="link-btn phone-btn rounded-2xl py-4 px-5 flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <img src="tiktok2.png" alt="틱톡" class="w-6 h-6 object-contain">
                        <span class="font-medium text-gray-800">틱톡</span>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-gray-400">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <!-- Button: KakaoTalk Link Menu -->
                <a href="#" data-link="kakao" class="link-btn phone-btn rounded-2xl py-4 px-5 flex items-center justify-between transition-all">
                    <div class="flex items-center gap-3">
                        <img src="카카오채널.png" alt="카카오채널" class="w-6 h-6 object-contain">
                        <span class="font-medium text-gray-800">카카오채널</span>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-gray-400">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>
            </div>

            <!-- Footer -->
            <div class="bg-white px-6 py-5 text-center border-t border-gray-100">
                <p class="text-xs text-gray-400 font-light">
                    © 2026 다찌 마을 · All rights reserved · 🍡
                </p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full text-sm shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none" style="font-family: 'Noto Sans KR', sans-serif;">
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
